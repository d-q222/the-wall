<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Leak Detection Scoreboard — Ethical Wall Brain</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/demo/assets/theme.css">
    <style>
        body { padding: 2.5rem; }

        .container {
            max-width: 1400px;
            margin: 0 auto;
        }

        header.top {
            display: flex;
            justify-content: space-between;
            align-items: flex-start;
            gap: 2rem;
            margin-bottom: 2rem;
        }

        h1 {
            font-family: var(--font-doc);
            font-size: 2.25rem;
            font-weight: 600;
            color: var(--text);
        }

        .subtitle {
            font-size: 1.05rem;
            color: var(--text-secondary);
            margin-top: 0.35rem;
        }

        .last-updated {
            font-size: 0.85rem;
            color: var(--text-tertiary);
            margin-top: 0.75rem;
        }

        .scoreboard {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            overflow: auto;
            margin-bottom: 2rem;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 1rem;
        }

        thead {
            background-color: var(--surface-raised);
            border-bottom: 1px solid var(--border);
        }

        th {
            padding: 0.9rem 1rem;
            text-align: left;
            font-weight: 600;
            color: var(--text);
            border-right: 1px solid var(--border);
        }

        th:last-child {
            border-right: none;
        }

        td {
            padding: 0.9rem 1rem;
            border-right: 1px solid var(--border);
            border-bottom: 1px solid var(--border);
        }

        td:last-child {
            border-right: none;
        }

        tbody tr:last-child td {
            border-bottom: none;
        }

        .detector-name {
            font-weight: 600;
            color: var(--text);
            min-width: 150px;
        }

        .eval-set-header {
            background-color: var(--surface-raised);
            font-weight: 600;
            color: var(--text-secondary);
            text-align: center;
            padding: 0.7rem 1rem;
        }

        .metric {
            display: flex;
            flex-direction: column;
            align-items: center;
            min-width: 100px;
        }

        .metric-label {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            margin-bottom: 0.25rem;
        }

        .metric-value {
            font-size: 1.25rem;
            font-weight: 600;
            color: var(--text);
        }

        .caught {
            color: var(--success);
        }

        .false-alarm {
            color: var(--danger);
        }

        .neutral {
            color: var(--text-secondary);
        }

        .highlighted {
            background-color: color-mix(in srgb, var(--accent) 12%, transparent);
            border: 1px solid var(--accent);
        }

        .blind-section {
            background-color: var(--surface);
            border: 1px solid var(--border);
            border-radius: 10px;
            padding: 1.75rem;
            margin-bottom: 2rem;
        }

        .blind-title {
            font-family: var(--font-doc);
            font-size: 1.35rem;
            font-weight: 600;
            margin-bottom: 1.25rem;
            color: var(--text);
        }

        .blind-detectors {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
            gap: 1.25rem;
        }

        .blind-detector {
            background-color: var(--surface-raised);
            padding: 1.25rem;
            border-radius: 8px;
            border: 1px solid var(--border);
        }

        .blind-detector-name {
            font-size: 1rem;
            font-weight: 600;
            margin-bottom: 0.9rem;
            color: var(--text);
        }

        .blind-metrics {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 0.9rem;
        }

        .blind-metric {
            display: flex;
            flex-direction: column;
        }

        .blind-metric-label {
            font-size: 0.75rem;
            color: var(--text-tertiary);
            margin-bottom: 0.25rem;
        }

        .blind-metric-value {
            font-size: 1.2rem;
            font-weight: 600;
            color: var(--text);
        }

        .no-results {
            text-align: center;
            padding: 4rem 2rem;
            color: var(--text-tertiary);
            font-size: 1.15rem;
        }

        @media (max-width: 768px) {
            header.top { flex-direction: column; gap: 1rem; }
            h1 { font-size: 1.6rem; }
            body { padding: 1.25rem; }
            table { font-size: 0.85rem; }
            th, td { padding: 0.6rem; }
            .metric-value { font-size: 1.05rem; }
        }
    </style>
</head>
<body>
    <div id="site-nav"></div>
    <div class="container">
        <header class="top">
            <div>
                <h1>Leak Detection Scoreboard</h1>
                <p class="subtitle">Ethical Wall Brain — evaluation results</p>
                <p class="last-updated">Last updated <span id="updateTime">--:--:--</span>, refreshing every 5s</p>
            </div>
            <button class="theme-toggle" id="theme-toggle" type="button">Light mode</button>
        </header>

        <div id="content">
            <div class="no-results">Loading results…</div>
        </div>
    </div>

    <script src="/demo/assets/nav.js" defer></script>
    <script>
        var themeToggle = document.getElementById("theme-toggle");
        var root = document.documentElement;

        function applyTheme(theme) {
            root.setAttribute("data-theme", theme);
            themeToggle.textContent = theme === "dark" ? "Light mode" : "Dark mode";
            try { localStorage.setItem("wall-scoreboard-theme", theme); } catch (e) {}
        }

        (function initTheme() {
            var saved = null;
            try { saved = localStorage.getItem("wall-scoreboard-theme"); } catch (e) {}
            applyTheme(saved === "light" ? "light" : "dark");
        })();

        themeToggle.addEventListener("click", function () {
            var current = root.getAttribute("data-theme");
            applyTheme(current === "dark" ? "light" : "dark");
        });

        const params = new URLSearchParams(window.location.search);
        const useSample = params.has('sample');
        const resultsUrl = params.get('src') || (useSample ? './sample_results.json' : '/results/results.json');

        async function loadAndRender() {
            try {
                const response = await fetch(resultsUrl);
                if (!response.ok) {
                    throw new Error(`HTTP ${response.status}`);
                }
                const data = await response.json();
                render(data);
            } catch (error) {
                document.getElementById('content').innerHTML = `
                    <div class="no-results">
                        Unable to load results. ${useSample ? '(Sample mode)' : '(Make sure the API is serving /results/results.json)'}<br/>
                        <small>${error.message}</small>
                    </div>
                `;
            }
            updateTimestamp();
        }

        function updateTimestamp() {
            const now = new Date();
            document.getElementById('updateTime').textContent = now.toLocaleTimeString();
        }

        function render(data) {
            if (!data || Object.keys(data).length === 0) {
                document.getElementById('content').innerHTML = '<div class="no-results">No results yet</div>';
                return;
            }

            // Separate blind results from other eval sets
            const blindResults = {};
            const regularResults = {};

            for (const [detector, evalSets] of Object.entries(data)) {
                regularResults[detector] = {};
                blindResults[detector] = null;

                for (const [evalSet, result] of Object.entries(evalSets)) {
                    if (evalSet === 'blind') {
                        blindResults[detector] = result;
                    } else {
                        regularResults[detector][evalSet] = result;
                    }
                }
            }

            // Order of detectors to display
            const detectorOrder = ['regex', 'carryover', 'prompt_judge', 'base_judge', 'river_judge'];
            const orderedDetectors = detectorOrder.filter(d => Object.keys(regularResults).includes(d));

            // Order of eval sets
            const allEvalSets = new Set();
            for (const evalSets of Object.values(regularResults)) {
                Object.keys(evalSets).forEach(e => allEvalSets.add(e));
            }
            const evalSetOrder = ['hard', 'standard', 'demo'];
            const orderedEvalSets = evalSetOrder.filter(e => allEvalSets.has(e));
            const otherEvalSets = Array.from(allEvalSets).filter(e => !evalSetOrder.includes(e));
            const sortedEvalSets = [...orderedEvalSets, ...otherEvalSets];

            let html = '';

            // Main scoreboard
            html += '<div class="scoreboard">';
            html += '<table><thead><tr>';
            html += '<th>Detector</th>';

            // Header for each eval set
            for (const evalSet of sortedEvalSets) {
                html += `<th class="eval-set-header" colspan="3">${evalSet.charAt(0).toUpperCase() + evalSet.slice(1)}</th>`;
            }

            html += '</tr><tr><th>Detector</th>';

            // Sub-headers for each metric
            for (const evalSet of sortedEvalSets) {
                html += '<th style="text-align: center; font-size: 0.85rem;">Leaks caught</th>';
                html += '<th style="text-align: center; font-size: 0.85rem;">False alarms</th>';
                html += '<th style="text-align: center; font-size: 0.85rem;">n</th>';
            }

            html += '</tr></thead>';
            html += '<tbody>';

            // Data rows
            for (const detector of orderedDetectors) {
                html += '<tr>';
                html += `<td class="detector-name">${detector}</td>`;

                for (const evalSet of sortedEvalSets) {
                    const result = regularResults[detector][evalSet];

                    if (!result) {
                        html += '<td>—</td><td>—</td><td>—</td>';
                    } else {
                        // Determine if this cell should be highlighted
                        const isHighlighted = detector === 'river_judge' && evalSet === 'hard' ||
                                              (detector === 'prompt_judge' && evalSet === 'hard' && !regularResults['river_judge']);

                        const cellClass = isHighlighted ? 'highlighted' : '';

                        // Leaks caught
                        const caughtTd = `<td class="${cellClass}"><div class="metric"><div class="metric-label">Caught</div><div class="metric-value caught">${result.caught}</div><div class="metric-label" style="font-size: 0.65rem;">${result.caught}/${result.leaks}</div></div></td>`;

                        // False alarms
                        const falseAlarmTd = `<td class="${cellClass}"><div class="metric"><div class="metric-label">False alarms</div><div class="metric-value false-alarm">${result.false_alarms}</div><div class="metric-label" style="font-size: 0.65rem;">${result.false_alarms}/${result.clean}</div></div></td>`;

                        // n (sample size)
                        const nTd = `<td class="${cellClass}"><div class="metric"><div class="metric-label">n</div><div class="metric-value neutral">${result.n}</div></div></td>`;

                        html += caughtTd + falseAlarmTd + nTd;
                    }
                }

                html += '</tr>';
            }

            html += '</tbody></table>';
            html += '</div>';

            // Blind evaluation set in separate box
            if (Object.values(blindResults).some(r => r !== null)) {
                html += '<div class="blind-section">';
                html += '<div class="blind-title">Blind evaluation set</div>';
                html += '<div class="blind-detectors">';

                for (const detector of orderedDetectors) {
                    const result = blindResults[detector];
                    if (!result) continue;

                    html += '<div class="blind-detector">';
                    html += `<div class="blind-detector-name">${detector}</div>`;
                    html += '<div class="blind-metrics">';

                    html += '<div class="blind-metric">';
                    html += '<div class="blind-metric-label">Leaks caught</div>';
                    html += `<div class="blind-metric-value caught">${result.caught}/${result.leaks}</div>`;
                    html += '</div>';

                    html += '<div class="blind-metric">';
                    html += '<div class="blind-metric-label">False alarms</div>';
                    html += `<div class="blind-metric-value false-alarm">${result.false_alarms}/${result.clean}</div>`;
                    html += '</div>';

                    html += '<div class="blind-metric">';
                    html += '<div class="blind-metric-label">Sample size</div>';
                    html += `<div class="blind-metric-value neutral">${result.n}</div>`;
                    html += '</div>';

                    html += '<div class="blind-metric">';
                    html += '<div class="blind-metric-label">Accuracy</div>';
                    const accuracy = result.n > 0 ? Math.round((result.caught + (result.clean - result.false_alarms)) / result.n * 100) : 0;
                    html += `<div class="blind-metric-value">${accuracy}%</div>`;
                    html += '</div>';

                    html += '</div>';
                    html += '</div>';
                }

                html += '</div>';
                html += '</div>';
            }

            document.getElementById('content').innerHTML = html;
        }

        // Initial load and set up auto-refresh
        loadAndRender();
        setInterval(loadAndRender, 5000);
    </script>
</body>
</html>
